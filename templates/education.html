{% extends 'base.html' %}
{% block content %}
    <main>
        <section class="education" id="education">
            <div class="container">
                <div class="section-heading">
                    <p class="section-kicker">Pendidikan saya</p>
                    <h1>Education</h1>

                    {% if user.is_superuser %} 
                        <button
                            type="button"
                            class="button education-add-button"
                            popovertarget="add-education-modal">

                            <span aria-hidden="true">+</span>
                            Tambah Riwayat Pendidikan

                        </button>
                    {% endif %}
                </div>

                <button class="button button-secondary" onclick="showToast('Notifikasi Sistem', 'Education berhasil dimuat dengan baik!', 'success')">
                    Test Toast Notifikasi
                </button>

                <formid="education-search-form"
                      method="get"
                      action="{% url 'main:show_education' %}"
                      class="education-search">

                    <input id="education-search-input"
                           type="search"
                           name="school"
                           value="{{ school_query }}"
                           placeholder="Cari berdasarkan nama sekolah"
                           class="education-search__input"
                           aria-label="Cari berdasarkan nama sekolah">

                    <button type="submit" class="button">Cari</button>
                </form>
                </div>

                <div class="education-list">
                    <!-- Loading state --> 
                    <div id="education-loading" class="empty-state hide"> 
                        <p>Memuat data pendidikan...</p> 
                    </div> 
                    
                    <!-- Error state --> 
                    <div id="education-error" class="empty-state hide"> 
                        <p>Gagal memuat data pendidikan.</p> 
                    </div> 
                    
                    <!-- Empty state --> 
                    <div id="education-empty" class="empty-state hide"> 
                        <p>Belum ada data pendidikan yang ditambahkan.</p> 
                    </div> 
                    
                    <!-- Data Education --> 
                    <div id="education-list" class="education-list hide"> 

                    </div>
                </div>
            </div>
        </section>
        </main>

    <script>
        const EDUCATION_ENDPOINT ="{% url 'main:get_education_json' %}";

        const IS_SUPERUSER ="{{ user.is_superuser|yesno:'true,false' }}" === "true";

        const IS_EDITOR ="{{ is_editor|yesno:'true,false' }}" === "true";

        const IS_AUTHENTICATED ="{{ user.is_authenticated|yesno:'true,false' }}" === "true";

        const educationLoading =
            document.getElementById("education-loading");

        const educationError =
            document.getElementById("education-error");

        const educationEmpty =
            document.getElementById("education-empty");

        const educationList =
            document.getElementById("education-list");


        function displayEducationSection({
            showLoading = false,
            showError = false,
            showEmpty = false,
            showEducationList = false
        }) {
            educationLoading.classList.toggle(
                "hide",
                !showLoading
            );

            educationError.classList.toggle(
                "hide",
                !showError
            );

            educationEmpty.classList.toggle(
                "hide",
                !showEmpty
            );

            educationList.classList.toggle(
                "hide",
                !showEducationList
            );
        }


        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }


        function buildEducationCardElement(item) {
            const education = item.fields;

            const article =
                document.createElement("article");

            const editUrl =
                "{% url 'main:update_education' '00000000-0000-0000-0000-000000000000' %}"
                    .replace(
                        "00000000-0000-0000-0000-000000000000",
                        educationId
                    );

            const editHtml =
                IS_SUPERUSER || IS_EDITOR
                    ? `
                        <a
                            href="${editUrl}"
                            class="button">
                            Edit
                        </a>
                    `
                    : "";

            const starUrl =
                "{% url 'main:toggle_education_star' '00000000-0000-0000-0000-000000000000' %}"
                    .replace(
                        "00000000-0000-0000-0000-000000000000",
                        educationId
                    );

            const starHtml = IS_AUTHENTICATED? `
                <form
                    method="post"
                    action="${starUrl}"
                    class="star-form">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="button">

                        ★
                        ${education.star_count}

                    </button>

                </form>
            `
            : "";

            const deleteUrl =
                "{% url 'main:delete_education' '00000000-0000-0000-0000-000000000000' %}"
                    .replace(
                        "00000000-0000-0000-0000-000000000000",
                        educationId
                    );

            const deleteHtml = IS_SUPERUSER? `
                <form
                    method="post"
                    action="${deleteUrl}"
                    style="display: inline;">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="button button-danger"
                        onclick="
                            return confirm(
                                'Yakin ingin menghapus pendidikan ini?'
                            );
                        ">
                        Hapus
                    </button>

                </form>
            `
            : "";
            article.className = "education-item";

            const starTitle =
                education.star_count > 0
                    ? `Dibintangi oleh ${escapeHtml(
                        education.starred_by_names
                    )}`
                    : "Jadilah yang pertama memberi star";

            article.innerHTML = `
                <div class="education-year">
                    ${escapeHtml(education.year)}
                </div>

                <div class="education-content">
                    <h3>
                        ${escapeHtml(education.school)}
                    </h3>

                    <p>
                        ${escapeHtml(education.level)}
                    </p>
                </div>

                <div class="education-card-actions">
                    <div class="education-actions">
                    
                        ${editHtml}

                        ${starHtml}

                        ${deleteHtml}

                        ${
                            education.education_url
                                ? `
                                    <a
                                        href="${escapeHtml(
                                            education.education_url
                                        )}"
                                        class="button">
                                        Lihat Detail
                                    </a>
                                  `
                                : ""
                        }

                        <button
                            type="button"
                            class="button"
                            title="${starTitle}">
                            ★
                            ${education.star_count}
                        </button>

                    </div>
                </div>
            `;

            return article;
        }


        async function fetchEducation(
            searchQuery = ""
        ) {
            displayEducationSection({
                showLoading: true
            });

            try {
                const url = searchQuery
                    ? `${EDUCATION_ENDPOINT}?school=${encodeURIComponent(
                        searchQuery
                    )}`
                    : EDUCATION_ENDPOINT;

                const response = await fetch(url, {
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                const educationData =
                    await response.json();

                educationList.innerHTML = "";

                if (educationData.length === 0) {
                    displayEducationSection({
                        showEmpty: true
                    });

                    return;
                }

                educationData.forEach(item => {
                    educationList.appendChild(
                        buildEducationCardElement(item)
                    );
                });

                displayEducationSection({
                    showEducationList: true
                });

            } catch (error) {
                console.error(
                    "Error loading education:",
                    error
                );

                displayEducationSection({
                    showError: true
                });
            }
        }


        fetchEducation();

        const searchForm =
            document.getElementById(
                "education-search-form"
            );

        const searchInput =
            document.getElementById(
                "education-search-input"
            );

        let searchDebounceTimer;

        searchInput.addEventListener(
            "input",
            function () {
                clearTimeout(searchDebounceTimer);

                searchDebounceTimer =
                    setTimeout(function () {
                        fetchEducation(
                            searchInput.value.trim()
                        );
                    }, 300);
            }
        );

        searchForm.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                clearTimeout(searchDebounceTimer);

                fetchEducation(
                    searchInput.value.trim()
                );
            }
        );

            function getCookie(name) {
                let cookieValue = null;

                if (
                    document.cookie &&
                    document.cookie !== ""
                ) {
                    const cookies =
                        document.cookie.split(";");

                    for (
                        let i = 0;
                        i < cookies.length;
                        i++
                    ) {
                        const cookie =
                            cookies[i].trim();

                        if (
                            cookie.substring(
                                0,
                                name.length + 1
                            ) === name + "="
                        ) {
                            cookieValue =
                                decodeURIComponent(
                                    cookie.substring(
                                        name.length + 1
                                    )
                                );

                            break;
                        }
                    }
                }

                return cookieValue;
            }

            const educationForm =
                document.getElementById(
                    "education-form"
                );

            educationForm.addEventListener(
                "submit",
                async function (event) {
                    event.preventDefault();

                    const response =
                        await fetch(
                            educationForm.action,
                            {
                                method: "POST",

                                headers: {
                                    "X-CSRFToken":
                                        getCookie("csrftoken")
                                },

                                body:
                                    new FormData(
                                        educationForm
                                    )
                            }
                        );

                    const result =
                        await response.json();

                    if (response.ok) {
                        educationForm.reset();

                        document
                            .getElementById(
                                "add-education-modal"
                            )
                            .hidePopover();

                        showToast(
                            "Berhasil",
                            "Riwayat pendidikan berhasil ditambahkan!",
                            "success"
                        );

                        fetchEducation(
                            searchInput.value.trim()
                        );

                    } else {
                        const errors =
                            result.errors
                                ? Object.values(
                                    result.errors
                                )
                                    .flat()
                                    .map(
                                        error =>
                                            error.message
                                    )
                                    .join(" ")
                                : result.message;

                        showToast(
                            "Gagal",
                            errors ||
                                "Gagal menambahkan pendidikan.",
                            "error"
                        );
                    }
                }
            );

            </script>

{% endblock content %}
