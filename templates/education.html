<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="#profile" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_education' %}">Education</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="education" id="education">
            <div class="container">
                <div class="section-heading">
                    <p class="section-kicker">Education</p>
                    <h2>My Education</h2>
                </div>

                <div class="education-list">
                    <article class="education-item">
                        <div class="education-year">2024</div>
                        <div class="education-content">
                            <h3>SMAN 78 Jakarta</h3>
                            <p>High School</p>
                        </div>
                    </article>

                    <article class="education-item">
                        <div class="education-year">2021</div>
                        <div class="education-content">
                            <h3>SMPN 2 Cilegon</h3>
                            <p>Middle School</p>
                        </div>
                    </article>

                    <article class="education-item">
                        <div class="education-year">2018</div>
                        <div class="education-content">
                            <h3>SDN Bernas</h3>
                            <p>Elementary School</p>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
